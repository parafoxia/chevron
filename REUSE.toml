version = 1

# Project files.
[[annotations]]
path = [
  ".gitignore",
  ".vscode/extensions.json",
  "README.md",
  "package.json",
  "tsconfig.json",
  "tsconfig.node.json",
  "src-tauri/.gitignore",
  "src-tauri/capabilities/default.json",
  "src-tauri/tauri.conf.json",
  "attributions/manifest.json",
]
SPDX-FileCopyrightText = "2026 Ethan Henderson"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Third-party licence texts for attributions that appear in neither lockfile.
[[annotations]]
path = ["attributions/OFL-1.1.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

# Generated lockfiles.
[[annotations]]
path = ["package-lock.json", "src-tauri/Cargo.lock"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Ethan Henderson"
SPDX-License-Identifier = "MIT OR Apache-2.0"
