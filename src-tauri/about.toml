# Licences we are willing to ship. cargo-about exits non-zero if a dependency
# introduces anything outside this list, so adding a crate with an unvetted
# licence fails the release build rather than shipping quietly.
#
# Apache-2.0 is listed first so dual-licensed crates resolve to the Apache text,
# which carries no per-crate copyright line and therefore dedupes far better.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "NCSA",
]

# Build and dev dependencies are not distributed.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# `targets` is deliberately unset -- scripts/generate-licenses.mjs passes
# --target explicitly so each build attributes only the crates it ships.

# Crates that package their licence in a form cargo-about cannot read.
workarounds = [
    "chrono",
    "clap",
    "cocoa",
    "gtk",
    "ring",
    "rustix",
]
